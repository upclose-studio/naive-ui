packages:
  - '.'
  - 'packages/*'
  - 'playground/nuxt'
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - vueuc@0.4.66
onlyBuiltDependencies:
  - esbuild
overrides:
  '@juggle/resize-observer': file:./vendor/resize-observer
  cssstyle: 5.2.1
  vite: ^8.0.10
peerDependencyRules:
  ignoreMissing:
    - '@babel/core'
    - postcss
    - rollup
    - webpack
